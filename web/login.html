<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#141b26" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Portfolio" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="robots" content="noindex" />
    <title>Giriş · Portfolio Tracker</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/login.js"></script>
  </head>
  <body>
    <main class="login">
      <form id="login">
        <img src="/icon.svg" alt="" width="44" height="44" />
        <h1>Portfolio Tracker</h1>
        <p id="intro" hidden>İlk kurulum: kodu girin ve kullanacağınız parolayı belirleyin (en az 10 karakter).</p>
        <div class="field" id="code-field" hidden>
          <label for="code">Kurulum kodu</label>
          <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" />
        </div>
        <input type="text" name="username" autocomplete="username" value="portfolio" hidden />
        <div class="field">
          <label for="password">Parola</label>
          <input id="password" type="password" autocomplete="current-password" required autofocus />
        </div>
        <div class="field" id="again-field" hidden>
          <label for="again">Parola (tekrar)</label>
          <input id="again" type="password" autocomplete="new-password" />
        </div>
        <p class="error" id="error" role="alert" hidden></p>
        <button class="btn primary" id="submit">Giriş yap</button>
      </form>
    </main>
  </body>
</html>
